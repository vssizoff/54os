---
# Calamares bootloader module configuration.
#
# Target layout expected:
#   root filesystem: /
#   EFI System Partition: /boot/efi
#
# The ESP must be a FAT32 partition assigned mount point /boot/efi
# in the Calamares partitioning screen.

efiBootLoader: "grub"

# GRUB binaries and config generator in target rootfs.
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"

# Important for QEMU/OVMF and machines where NVRAM entries are not persistent:
# request the standard UEFI fallback loader:
#   /boot/efi/EFI/BOOT/BOOTX64.EFI
#
# This option is supported only if your installed Calamares bootloader module
# recognizes it. If it does not, use the post-install script described below.
grubInstallArguments:
  - "--target=x86_64-efi"
  - "--efi-directory=/boot/efi"
  - "--bootloader-id=CachyOS"
  - "--recheck"
  - "--removable"

# CachyOS kernel artifacts in the unpacked rootfs.
kernel: "/boot/vmlinuz-linux-cachyos"
fallback: "/boot/initramfs-linux-cachyos-fallback.img"

# Normal Arch/CachyOS rootfs: generate menu entries using grub-mkconfig.
# Keep os-prober off by default; enable only if you intentionally support
# detecting another OS in a dual-boot installer.
useOsProber: false
