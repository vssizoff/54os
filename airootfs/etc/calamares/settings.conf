---
# Calamares main settings for CachyOS offline installer

# Branding component name (directory under /usr/share/calamares/branding/)
branding: cachyos

# Run installer in target chroot (normal installer behavior)
dont-chroot: false

# OEM mode: false for normal installation, true for first-boot setup
oem-setup: false

# Show "Are you sure you want to quit?" prompt
prompt-install: true

# Cancel button availability
disable-cancel: false
disable-cancel-during-exec: true

# Hide back/next buttons while modules execute
hide-back-and-next-during-exec: true

# Quit installer after successful installation
quit-at-end: false

# Search paths for module configurations
modules-search: [ local ]

# Execution sequence
sequence:
  # Show modules (user-visible steps)
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary

  # Exec modules (actual work)
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - users
      - displaymanager
      - bootloader
      - initramfs

  # Final show module
  - show:
      - finished
