[options]
Architecture = auto
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8
Color

# CachyOS repo.
#
# Direct Server is intentional:
# this config is read by mkarchiso before cachyos-mirrorlist exists in
# the temporary airootfs. Do NOT use:
# Include = /etc/pacman.d/cachyos-mirrorlist
#
# Put CachyOS before Arch repos so CachyOS replacement/optimized packages
# take precedence when the same package exists in both repositories.

[custom]
SigLevel = Optional TrustAll
Server = file:///home/sizoff/iso/cachy-offline/local-repo

[cachyos]
Server = https://mirror.cachyos.org/repo/$arch/$repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
